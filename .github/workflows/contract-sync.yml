name: Contract Schema Sync & Validation

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/app/schemas/contract/**'
      - 'backend/app/core/contract_version.py'
      - 'contracts/**'
      - 'scripts/export_contract_schemas.py'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/app/schemas/contract/**'
      - 'backend/app/core/contract_version.py'
      - 'contracts/**'
      - 'scripts/export_contract_schemas.py'

jobs:
  validate-contract-sync:
    name: Verify Contract Schemas & Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Contract Schema Sync & Unit Tests
        run: |
          cd backend
          pytest tests/test_contract_schema_sync.py tests/test_contract.py -v
